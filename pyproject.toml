[project]
name = "bama-mcp"
version = "0.1.2"
description = "Unofficial read-only MCP server for bama.ir: search car ads, compare prices, browse brands and cities"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Amirreza" }]
keywords = ["mcp", "model-context-protocol", "bama", "iran", "cars", "persian"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "fastmcp>=2.0,<5",
  "httpx>=0.27",
]

[project.scripts]
bama-mcp = "bama_mcp.server:main"

[project.urls]
Homepage = "https://github.com/Amrzas/bama-mcp"
Repository = "https://github.com/Amrzas/bama-mcp"
Issues = "https://github.com/Amrzas/bama-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bama_mcp"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
markers = ["live: hits the real bama.ir API (needs an Iranian IP)"]
addopts = "-m 'not live'"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]
